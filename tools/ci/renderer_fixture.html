<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>hide-and-seek — worst-case renderer fixture</title>
<!--
  THE WORST-CASE RENDERER FIXTURE (design note test 44; prompts/30-review-loop.md
  checklist item 15, final bullet).

  WHY THIS EXISTS
  ---------------
  tools/ci/docker_smoke.sh runs with no ANTHROPIC_API_KEY, so every seat in the
  only replay CI can produce plays scripted: `scatter` says nothing and `burrow`
  says at most one five-character line per game, and NEITHER ever emits a
  `radio`. So the wasm-viewer smoke, the soak and the screenshot never once
  exercise the chrome that exists solely to show what a model said — the feed's
  say and radio rows. cogchemists (2026-08-24) shipped four clipped speech
  bubbles with a fully green board for exactly this reason.

  WHAT IT DOES
  ------------
  It loads the REAL page — client/replay_broadcast.html, the same bytes the
  wasm bundle's index.html is spliced from — and shims ONLY the wasm entry
  (the BROADCAST_CORE splice slot, where static_replay.js would install
  the Worker that owns the board's OffscreenCanvas). Nothing here re-implements a
  draw: every feed row on screen is rendered by the page's own hnsEvent /
  hnsDirectives / pushFeed (the particle-worlds 2026-08-26 scar).

  The frame it hands the page is tools/ci/renderer_fixture_state.json, built by
  the SHIPPED src/hns/broadcast.nim off a real sim and regenerated by
  tests/test_hns_renderer_fixture.nim, which fails the build when it drifts. It
  carries a full-cap 10-rune `say` on ALL SIX seats at once, a full-cap 96-rune
  `radio` on all six directives, three locked objects, a sealed fort, a vault in
  flight and a full exposure ribbon.

  WHAT IT ASSERTS, at 360, 720 and 1280 CSS px of board width:
    1. every one of the twelve model strings reaches the DOM at its FULL
       length — a quietly shortened remark leaves a fixture passing while
       testing nothing;
    2. every row carrying one is laid out wholly inside the frame (no edge
       crossed), which is the layout half of item 15;
    3. no row is ellipsized by the browser (scrollWidth > clientWidth on a
       clipped box) — ellipsis is a design choice for a nameplate and a defect
       for a sentence.

  It sets data-replay-loaded="true" when all three hold and
  data-replay-error="<what failed>" when one does not, so
  `node tools/ci/viewer_smoke.mjs --url … --strict-text-bounds` gates it in
  its own ci.yml step.

  NOTE ON canvas_text: this game draws no fillText/strokeText anywhere — the
  board's speech bubble is a sprite RASTERISED IN NIM (src/hns/global.nim's
  buildShoutBubble) and composited with drawImage, and the feed is DOM. So
  --strict-text-bounds reports total: 0 here as it does on the bundle, and the
  assertions below are the gate that actually measures this game's model text.
  The bubble's own placement is measured where it is computed, in
  tests/test_hns_viewer.nim's shoutBubblesStayInsideTheBoard.
-->
<style>
  html, body { margin: 0; background: #14100c; color: #f2e8d8;
               font: 12px/1.4 ui-monospace, monospace; }
  #frame { display: block; border: 0; width: 1280px; height: 720px; }
  #log { padding: 8px 10px; white-space: pre-wrap; }
</style>
</head>
<body>
<div id="log">renderer fixture: booting…</div>
<iframe id="frame" title="the real broadcast page"></iframe>
<script>
(function () {
  'use strict';

  var WIDTHS = [360, 720, 1280];      // including the featured-match 360 px.
  var logEl = document.getElementById('log');
  var lines = [];

  function log(line) {
    lines.push(line);
    logEl.textContent = lines.join('\n');
  }

  function fail(message) {
    log('FAIL ' + message);
    document.documentElement.setAttribute('data-replay-error', message);
    throw new Error(message);
  }

  function get(url) {
    return fetch(url, { cache: 'no-store' }).then(function (r) {
      if (!r.ok) throw new Error(url + ' -> HTTP ' + r.status);
      return r.text();
    });
  }

  var sleep = function (ms) {
    return new Promise(function (r) { setTimeout(r, ms); });
  };

  // The wasm entry, and only that: the page asks window.HnsStaticReplay for a
  // core when the static bundle is on the page. Ours accepts the config, keeps
  // the frame callback and answers the handful of view questions the chrome
  // asks it. It draws nothing, because the board is not what this fixture
  // measures.
  var SHIM = [
    '<script>',
    '(function () {',
    '  var T = { scale: 1, offsetX: 0, offsetY: 0, nativeW: 720, nativeH: 400,',
    '            zoom: 1, minZoom: 1, maxZoom: 12, fitScale: 1, focusX: 0,',
    '            focusY: 0, visW: 720, visH: 400 };',
    '  window.HnsStaticReplay = {',
    '    createCore: function (config) {',
    '      var core = {',
    '        start: function () {},',
    '        sendCommand: function (cmd) { window.__fixtureCommands.push(cmd); },',
    '        setViewportFit: function () {},',
    '        resetView: function () {},',
    '        zoomAt: function () {},',
    '        setZoom: function () {},',
    '        panBy: function () {},',
    '        panByMap: function () {},',
    '        getTransform: function () { return T; }',
    '      };',
    '      window.__fixtureFeed = function (text) { config.onText(text); };',
    '      window.__fixtureStatus = function (st) { config.onStatus(st); };',
    '      return core;',
    '    }',
    '  };',
    '  window.__fixtureCommands = [];',
    '}());',
    '<\/script>'
  ].join('\n');

  function buildPage(html) {
    // The three splice markers the dist bundle substitutes (Dockerfile.replay-viewer).
    var out = html
      .replace('<!-- WIRE_CONSTANTS -->', '<script>window.HNS_WIRE = {};<\/script>')
      .replace('<!-- CHROME_COMMON -->',
               '<script src="/client/chrome_common.js"><\/script>')
      .replace('<!-- BROADCAST_CORE -->', SHIM);
    if (out.indexOf('<!-- BROADCAST_CORE -->') >= 0 ||
        out.indexOf('<!-- CHROME_COMMON -->') >= 0) {
      fail('client/replay_broadcast.html no longer carries the splice markers ' +
           'this fixture (and the dist bundle) substitute');
    }
    return out;
  }

  // Every row the page ever pushes into the feed, captured as it lands: the
  // feed keeps only MAX_FEED = 4 rows, so a snapshot at the end would miss
  // most of the twelve model rows.
  function watchFeed(win) {
    var rows = [];
    var feed = win.document.getElementById('killfeed');
    if (!feed) fail('the page has no #killfeed to render model text into');
    var observer = new win.MutationObserver(function (records) {
      for (var i = 0; i < records.length; i++) {
        var added = records[i].addedNodes;
        for (var j = 0; j < added.length; j++) {
          var node = added[j];
          if (!node || node.nodeType !== 1) continue;
          var rect = node.getBoundingClientRect();
          var say = node.querySelector('.hns-say');
          rows.push({
            text: (node.textContent || '').replace(/\s+/g, ' ').trim(),
            sayText: say ? (say.textContent || '') : '',
            rect: { left: rect.left, top: rect.top,
                    right: rect.right, bottom: rect.bottom },
            clipped: node.scrollWidth > node.clientWidth + 1
          });
        }
      }
    });
    observer.observe(feed, { childList: true });
    return rows;
  }

  function checkInsideFrame(win, rows, width) {
    var w = win.innerWidth, h = win.innerHeight;
    for (var i = 0; i < rows.length; i++) {
      var r = rows[i].rect;
      var edges = [];
      if (r.left < -1) edges.push('left');
      if (r.top < -1) edges.push('top');
      if (r.right > w + 1) edges.push('right');
      if (r.bottom > h + 1) edges.push('bottom');
      if (edges.length) {
        fail('at ' + width + 'px a feed row crossed the ' + edges.join('+') +
             ' edge of the ' + w + 'x' + h + ' frame: [' +
             Math.round(r.left) + ',' + Math.round(r.top) + ',' +
             Math.round(r.right) + ',' + Math.round(r.bottom) + '] ' +
             JSON.stringify(rows[i].text.slice(0, 60)));
      }
      if (rows[i].clipped) {
        fail('at ' + width + 'px a feed row was clipped by its box (a ' +
             'sentence, not a nameplate): ' +
             JSON.stringify(rows[i].text.slice(0, 60)));
      }
    }
  }

  function checkFullLength(rows, wanted, width) {
    for (var i = 0; i < wanted.length; i++) {
      var text = wanted[i].text;
      var found = false;
      for (var j = 0; j < rows.length; j++) {
        if (rows[j].text.indexOf(text) >= 0) { found = true; break; }
      }
      if (!found) {
        // Was it there but SHORT? That is the failure worth naming.
        var head = text.slice(0, 12);
        for (var k = 0; k < rows.length; k++) {
          if (rows[k].text.indexOf(head) >= 0) {
            fail('at ' + width + 'px the ' + wanted[i].kind + ' of seat ' +
                 wanted[i].seat + ' reached the feed SHORTENED: ' +
                 JSON.stringify(rows[k].text.slice(0, 120)));
          }
        }
        fail('at ' + width + 'px the ' + wanted[i].kind + ' of seat ' +
             wanted[i].seat + ' never reached the feed at all');
      }
    }
  }

  Promise.all([
    get('/client/replay_broadcast.html'),
    get('/tools/ci/renderer_fixture_state.json')
  ]).then(function (parts) {
    var state = JSON.parse(parts[1]);

    // The fixture's own strings, asserted full-cap here too: a fixture whose
    // frame was quietly shortened passes every check below while testing
    // nothing.
    var wanted = [];
    var events = state.events || [];
    for (var i = 0; i < events.length; i++) {
      if (events[i].k !== 'say') continue;
      if ([].concat(Array.from(events[i].text)).length !== 10) {
        fail('fixture say for slot ' + events[i].slot + ' is ' +
             events[i].text.length + ' runes, not the 10-rune cap');
      }
      wanted.push({ kind: 'say', seat: events[i].slot, text: events[i].text });
    }
    var directives = state.directives || [];
    for (var d = 0; d < directives.length; d++) {
      if (Array.from(directives[d].radio).length !== 96) {
        fail('fixture radio for slot ' + directives[d].slot + ' is ' +
             directives[d].radio.length + ' runes, not the 96-rune cap');
      }
      wanted.push({ kind: 'radio', seat: directives[d].slot,
                    text: directives[d].radio });
    }
    if (wanted.length !== 12) {
      fail('the fixture frame carries ' + wanted.length +
           ' model strings, not 6 says + 6 radios');
    }
    log('fixture frame: 6 full-cap says, 6 full-cap radios, ' +
        (state.objects || []).length + ' objects, tick ' + state.t);

    var iframe = document.getElementById('frame');
    return new Promise(function (resolve) {
      iframe.addEventListener('load', function () { resolve(iframe); },
                              { once: true });
      iframe.srcdoc = buildPage(parts[0]);
    }).then(function () {
      var win = iframe.contentWindow;
      return sleep(400).then(function () {
        if (typeof win.__fixtureFeed !== 'function') {
          fail('the page never asked the wasm adapter for a core — ' +
               'window.HnsStaticReplay.createCore was not called ' +
               '(the page threw before it, see the console)');
        }
        var rows = watchFeed(win);
        var chain = Promise.resolve();
        WIDTHS.forEach(function (width, index) {
          chain = chain.then(function () {
            iframe.style.width = width + 'px';
            iframe.style.height = Math.round(width * 720 / 1280) + 'px';
            win.dispatchEvent(new win.Event('resize'));
            return sleep(120);
          }).then(function () {
            rows.length = 0;
            // A fresh turn per pass: the page dedups a directive by
            // game:turn:slot, so the same commander line is re-issued on a
            // later turn rather than the record being tampered with.
            var pass = JSON.parse(JSON.stringify(state));
            pass.t = state.t + index;
            for (var i = 0; i < (pass.directives || []).length; i++) {
              pass.directives[i].turn = state.directives[i].turn + index;
            }
            win.__fixtureFeed(JSON.stringify(pass));
            return sleep(250);
          }).then(function () {
            checkFullLength(rows, wanted, width);
            checkInsideFrame(win, rows, width);
            log('ok at ' + width + 'px: ' + rows.length +
                ' feed rows, all 12 model strings full-length and inside the frame');
          });
        });
        return chain;
      });
    });
  }).then(function () {
    log('renderer fixture: ok');
    document.documentElement.setAttribute('data-replay-loaded', 'true');
  }).catch(function (error) {
    var message = (error && error.message) ? error.message : String(error);
    if (!document.documentElement.hasAttribute('data-replay-error')) {
      document.documentElement.setAttribute('data-replay-error', message);
    }
    log('renderer fixture FAILED: ' + message);
  });
}());
</script>
</body>
</html>
